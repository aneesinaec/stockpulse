# Render Blueprint for Backend
services:
  - type: web
    name: stockpulse-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: AUTH_SECRET_KEY
        generateValue: true
    plan: free
